<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--bg:#070914;--bg2:#0d1124;--panel:rgba(255,255,255,.055);--panel2:rgba(255,255,255,.09);--line:rgba(255,255,255,.1);--ink:#eef0ff;--soft:#98a2cc;--a:#8b5cf6;--b:#22d3ee;--c:#f472b6;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--sys:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:transparent;color:var(--ink);font-family:var(--sys);overflow-x:hidden;-webkit-font-smoothing:antialiased}
.stage{display:flex;justify-content:center;padding:12px 10px}
.app{width:100%;max-width:390px;border-radius:20px;position:relative;overflow:hidden;padding:14px;background:radial-gradient(120% 70% at 0% 0%,rgba(139,92,246,.28),transparent 55%),radial-gradient(100% 60% at 100% 100%,rgba(34,211,238,.2),transparent 55%),linear-gradient(180deg,var(--bg2),var(--bg));box-shadow:0 20px 44px rgba(0,0,0,.55),inset 0 0 0 1px var(--line)}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hdi{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 6px 16px rgba(139,92,246,.4);flex:none}
.hdi svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hdt{min-width:0;flex:1}.hdt b{display:block;font-size:15px;font-weight:800;letter-spacing:.2px}.hdt span{display:block;font-size:11px;color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:10.5px;font-weight:800;letter-spacing:.6px;padding:4px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.1)}.pill.bad{color:var(--bad);border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.1)}.pill.acc{color:#fff;border:0;background:linear-gradient(135deg,var(--a),var(--b))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px;backdrop-filter:blur(6px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{grid-template-columns:1fr 1fr 1fr}
.k{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--soft);font-weight:700}.v{font-size:14px;font-weight:800;margin-top:3px;word-break:break-word}
.sp{height:8px}.hero{text-align:center;padding:14px 10px}.hero .big{font-size:30px;font-weight:900;background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .6s}
.bar.hot i{background:linear-gradient(90deg,var(--warn),var(--bad))}.bar.ok i{background:linear-gradient(90deg,var(--ok),var(--b))}
.row{display:flex;align-items:center;gap:8px}.sb{justify-content:space-between}.mut{color:var(--soft);font-size:11px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--soft);border-radius:99px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer}.chip.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:transparent}
.btn{border:0;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));font-family:var(--sys)}.btn.alt{background:var(--panel2);border:1px solid var(--line)}
.ft{margin-top:12px;text-align:center;font-size:10px;color:var(--soft);letter-spacing:.6px}
.av{width:56px;height:56px;border-radius:18px;object-fit:cover;background:linear-gradient(135deg,var(--a),var(--c));flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
.li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:6px}.li.me{border-color:var(--a);background:rgba(139,92,246,.16)}
.rk{width:26px;height:26px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex:none}.rk.r1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#2a1a00}.rk.r2{background:linear-gradient(135deg,#e5e7eb,#9ca3af);color:#111}.rk.r3{background:linear-gradient(135deg,#fdba74,#c2410c);color:#2a0f00}
.hide{display:none!important}canvas{display:block;width:100%;touch-action:manipulation}
.cell{aspect-ratio:1;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;cursor:pointer}.cell.win{background:linear-gradient(135deg,rgba(139,92,246,.5),rgba(34,211,238,.4))}
</style></head><body><div class="stage"><div class="app" id="app"></div></div><script>var DATA=/*DATA_START*/{}/*DATA_END*/;var IC={bolt:'M13 2L4 14h7l-1 8 9-12h-7z',cpu:'M7 7h10v10H7zM9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3',ram:'M3 8h18v8H3zM7 8v8M11 8v8M15 8v8M19 8v8',disk:'M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6',clock:'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z',globe:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',coin:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v10M9.5 9.5C9.5 8.5 10.6 8 12 8s2.5.5 2.5 1.5S13.4 11 12 11s-2.5.5-2.5 1.5S10.6 14 12 14s2.5-.5 2.5-1.5',heart:'M12 20s-7-4.4-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.6-9 9-9 9z',crown:'M3 8l4 4 5-7 5 7 4-4-2 11H5z',trophy:'M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 21h8',fire:'M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4 0-6 1-9z',cart:'M3 4h2l2.5 10h10L20 7H6M9 19a1 1 0 1 0 0 .1M17 19a1 1 0 1 0 0 .1',receipt:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',users:'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20c0-3 3-5 6-5s6 2 6 5M17 11a3 3 0 1 0-1-5.8M21 20c0-2.5-1.8-4-4-4.6',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.6-7 8-7s8 3 8 7',link:'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1',check:'M4 12l5 5L20 6',x:'M6 6l12 12M18 6L6 18',wifi:'M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5v.1',gift:'M4 11h16v10H4zM3 7h18v4H3zM12 7v14M12 7C9 7 8 3 10.5 3 12 3 12 5 12 7zM12 7c3 0 4-4 1.5-4C12 3 12 5 12 7z',game:'M6 8h12a4 4 0 0 1 4 4v2a3 3 0 0 1-5 2l-1-1H8l-1 1a3 3 0 0 1-5-2v-2a4 4 0 0 1 4-4zM8 11v3M6.5 12.5h3M16 12h.1M18 13.5h.1',pulse:'M3 12h4l2-6 4 12 2-6h6'}
function ic(n){return '<svg viewBox="0 0 24 24"><path d="'+(IC[n]||IC.bolt)+'"/></svg>'}
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(id){return document.getElementById(id)}
function pct(n){n=Number(n)||0;return Math.max(0,Math.min(100,n))}
function bar(p,cls){return '<div class="bar '+(cls||(p>85?'hot':''))+'"><i style="width:'+pct(p)+'%"></i></div>'}
function tile(k,v){return '<div class="card"><div class="k">'+E(k)+'</div><div class="v">'+E(v)+'</div></div>'}
function head(icon,t,s,right){return '<div class="hd"><div class="hdi">'+ic(icon)+'</div><div class="hdt"><b>'+E(t)+'</b><span>'+E(s||'')+'</span></div>'+(right||'')+'</div>'}
function foot(){return '<div class="ft">'+E((DATA&&DATA.bot)||'vanXone </>')+'</div>'}


var B,turn,over,sc={x:0,o:0,d:0},W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function win(b){for(var i=0;i<8;i++){var w=W[i];if(b[w[0]]&&b[w[0]]==b[w[1]]&&b[w[0]]==b[w[2]])return w}return null}
function mm(b,pl){var w=win(b);if(w)return{s:b[w[0]]=='O'?1:-1};if(b.indexOf('')<0)return{s:0};var best=null;for(var i=0;i<9;i++)if(!b[i]){b[i]=pl;var r=mm(b,pl=='O'?'X':'O');b[i]='';if(best===null||(pl=='O'?r.s>best.s:r.s<best.s))best={s:r.s,m:i}}return best}
function reset(){B=['','','','','','','','',''];turn='X';over=false;draw()}
function draw(){var w=win(B),msg=w?(B[w[0]]=='X'?'Kamu menang':'Bot menang'):B.indexOf('')<0?'Seri':'Giliranmu (X)';
 if(!over&&(w||B.indexOf('')<0)){over=true;if(w)sc[B[w[0]]=='X'?'x':'o']++;else sc.d++}
 var cells=B.map(function(v,i){return '<div class="cell '+(w&&w.indexOf(i)>=0?'win':'')+'" data-i="'+i+'">'+(v=='X'?'<span style="color:var(--b)">X</span>':v=='O'?'<span style="color:var(--c)">O</span>':'')+'</div>'}).join('');
 $('app').innerHTML=head('game','Tic Tac Toe','Lawan bot (tidak bisa dikalahkan, coba seri)',' <span class="pill acc">'+msg+'</span>')+'<div class="grid g3" style="gap:8px">'+cells+'</div><div class="sp"></div><div class="grid g3">'+tile('Kamu',sc.x)+tile('Seri',sc.d)+tile('Bot',sc.o)+'</div><div class="sp"></div><button class="btn" style="width:100%" id="rs">Main lagi</button>'+foot();
 var cs=document.querySelectorAll('.cell');for(var i=0;i<cs.length;i++)cs[i].onclick=function(){var k=+this.getAttribute('data-i');if(over||B[k])return;B[k]='X';draw();if(!over){var r=mm(B.slice(),'O');if(r&&r.m!=null){B[r.m]='O';draw()}}};
 $('rs').onclick=reset}
reset();
</script></body></html>
